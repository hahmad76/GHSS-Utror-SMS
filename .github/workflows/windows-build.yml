name: Build GSMS SMS Windows 7 10 11

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'

jobs:
  build-windows:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
        include:
          - arch: x86
            python_arch: x86
          - arch: x64
            python_arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.7.9 (${{ matrix.python_arch }})
        uses: actions/setup-python@v5
        with:
          python-version: '3.7.9'
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: windows/requirements.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade "pip<24.1"
          python -m pip install -r windows/requirements.txt
          python -m pip install "pyinstaller==5.13.2"

      - name: Apply GSMS v1.0 upgrade
        working-directory: windows
        run: python patch_build.py

      - name: Build standalone executable with Win7-compatible Python runtime
        working-directory: windows
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name GSMS_SMS_v1.0_Windows_7_10_11_${{ matrix.arch }} main.py

      - name: Verify executable exists
        working-directory: windows
        run: |
          if (!(Test-Path "dist/GSMS_SMS_v1.0_Windows_7_10_11_${{ matrix.arch }}.exe")) { exit 1 }
          Get-Item "dist/GSMS_SMS_v1.0_Windows_7_10_11_${{ matrix.arch }}.exe" | Format-List Name,Length,LastWriteTime

      - name: Build Windows installer with desktop shortcut
        if: matrix.arch == 'x86'
        working-directory: windows
        shell: powershell
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if (!(Test-Path "dist/installer/GSMS_SMS_v1.0_Setup_x86.exe")) { throw "Installer was not produced" }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: GSMS_SMS_v1.0_Windows_7_10_11_${{ matrix.arch }}
          path: windows/dist/GSMS_SMS_v1.0_Windows_7_10_11_${{ matrix.arch }}.exe
          if-no-files-found: error

      - name: Upload Windows installer
        if: matrix.arch == 'x86'
        uses: actions/upload-artifact@v4
        with:
          name: GSMS_SMS_v1.0_Windows_7_10_11_Setup
          path: windows/dist/installer/GSMS_SMS_v1.0_Setup_x86.exe
          if-no-files-found: error
