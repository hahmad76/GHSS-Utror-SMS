name: Build GSMS SMS v1.0 Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v1.*'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Android APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GSMS_SMS_v1.0-ANDROID-ONLY.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GSMS_SMS_v1.0-ANDROID-ONLY
          path: GSMS_SMS_v1.0-ANDROID-ONLY.apk
