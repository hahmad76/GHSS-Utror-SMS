name: Build GSMS SMS v1.0

on:
  workflow_dispatch:
  push:
    tags:
      - 'v1.*'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release-unsigned.apk GSMS_SMS_v1.0-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GSMS_SMS_v1.0-unsigned
          path: GSMS_SMS_v1.0-unsigned.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: windows
        run: pip install -r requirements.txt pyinstaller

      - name: Build EXE
        working-directory: windows
        run: pyinstaller --noconfirm --clean --onefile --windowed --name GSMS_SMS_v1.0 main.py

      - uses: actions/upload-artifact@v4
        with:
          name: GSMS_SMS_v1.0.exe
          path: windows/dist/GSMS_SMS_v1.0.exe
