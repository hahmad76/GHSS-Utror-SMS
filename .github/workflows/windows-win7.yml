name: Build GSMS SMS Windows 7 10 11

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.8.10 32-bit
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          architecture: 'x86'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade "pip<22"
          python -m pip install pyinstaller==5.13.2 openpyxl==3.0.10

      - name: Apply GSMS v1.0 upgrade
        working-directory: windows
        run: python patch_build.py

      - name: Build portable Windows EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name GSMS_SMS_v1.0_Windows_7_10_11_32_64 windows/production.py

      - name: Verify EXE exists
        shell: powershell
        run: |
          if (!(Test-Path "dist/GSMS_SMS_v1.0_Windows_7_10_11_32_64.exe")) { throw "EXE was not produced" }
          Get-Item "dist/GSMS_SMS_v1.0_Windows_7_10_11_32_64.exe" | Format-List FullName,Length

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: GSMS_SMS_v1.0-Windows-7-10-11-32-64
          path: dist/GSMS_SMS_v1.0_Windows_7_10_11_32_64.exe
