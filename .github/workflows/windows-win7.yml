name: Build GSMS SMS Windows 7 10 11

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.6.8 32-bit for maximum Windows 7 compatibility
        uses: actions/setup-python@v5
        with:
          python-version: '3.6.8'
          architecture: 'x86'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade "pip<21"
          python -m pip install pyinstaller==4.10 openpyxl==3.0.10

      - name: Build Windows 7 compatible portable EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name GSMS_SMS_v1.0_Windows_7_10_11_32_64 windows/main.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: GSMS_SMS_v1.0-Windows-7-10-11-32-64
          path: dist/GSMS_SMS_v1.0_Windows_7_10_11_32_64.exe
